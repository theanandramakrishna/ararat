apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'
apply plugin: 'com.google.gms.google-services'
apply plugin: 'com.google.firebase.crashlytics'

android {
    compileSdkVersion 36

    defaultConfig {
        applicationId "org.anandram.xwordapp"
        minSdkVersion 21
        targetSdkVersion 36
        versionCode 7
        versionName "0.91"
        multiDexEnabled true
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    testOptions {
        unitTests {
            includeAndroidResources = true
        }
    }

    kotlinOptions {
        // Robolectric 4.15+ pulls Kotlin 1.8-compiled dependencies; the project
        // compiler is pinned to 1.6.21. The newer metadata is readable once the
        // version check is skipped.
        freeCompilerArgs += ["-Xskip-metadata-version-check"]
    }
    configurations {
        all {
            exclude group: 'org.apache.httpcomponents', module: 'httpclient'
        }
    }
    signingConfigs {
        release {
            storeFile file(project.hasProperty('XWORDAPP_STORE_FILE') ? project.XWORDAPP_STORE_FILE : System.getenv('XWORDAPP_STORE_FILE') ?: '')
            storePassword project.hasProperty('XWORDAPP_STORE_PASSWORD') ? project.XWORDAPP_STORE_PASSWORD : System.getenv('XWORDAPP_STORE_PASSWORD') ?: ''
            keyAlias System.getenv('XWORDAPP_KEY_ALIAS') ?: 'key0'
            keyPassword project.hasProperty('XWORDAPP_KEY_PASSWORD') ? project.XWORDAPP_KEY_PASSWORD : System.getenv('XWORDAPP_KEY_PASSWORD') ?: ''
        }
    }
    buildTypes {
        debug {
            applicationIdSuffix ".debug"
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
    }
    packagingOptions {
        exclude 'META-INF/DEPENDENCIES'
        exclude 'META-INF/NOTICE'
        exclude 'META-INF/LICENSE'
        exclude 'META-INF/LICENSE.txt'
        exclude 'META-INF/NOTICE.txt'
    }
    namespace 'org.anandram.xwordapp'
}

dependencies {
    implementation(platform("com.google.firebase:firebase-bom:31.5.0"))

    implementation 'androidx.legacy:legacy-support-v13:1.0.0'
    implementation 'com.google.android.material:material:1.4.0'
    implementation 'org.jsoup:jsoup:1.15.3'
    implementation('io.socket:socket.io-client:2.0.1') {
        // Android already provides org.json on the platform.
        exclude group: 'org.json', module: 'json'
    }
    implementation 'androidx.security:security-crypto:1.1.0-alpha06'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.15.1'
    testImplementation 'androidx.test:core:1.5.0'
    testImplementation 'com.squareup.okhttp3:mockwebserver:4.11.0'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test:core:1.6.1'
    implementation project(':library')
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk7:$kotlin_version"

    // Google Sign-In and Drive API
    implementation 'com.google.android.gms:play-services-auth:20.7.0'
    implementation 'com.google.api-client:google-api-client-android:2.2.0' 
    implementation 'com.google.http-client:google-http-client-android:1.43.3'
    implementation 'com.google.apis:google-api-services-drive:v3-rev20220815-2.0.0'

    // Multidex
    implementation 'androidx.multidex:multidex:2.0.1'

    implementation 'com.google.firebase:firebase-analytics'
    implementation 'com.google.firebase:firebase-crashlytics'
    implementation 'com.google.firebase:firebase-config'
    implementation 'com.google.firebase:firebase-perf'
}

repositories {
    mavenCentral()
}
